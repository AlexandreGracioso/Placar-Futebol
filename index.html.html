<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de transmissão – Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef0e8; --panel:#fbfcf8; --ink:#17261c; --muted:#5d6b61; --line:#cfd5c8;
    --stage:#2b3440; --grass-a:#2f7d44; --grass-b:#2a723e; --chalk:rgba(255,255,255,.85);
    --accent:#e8b923;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------- Estrutura ---------- */
  .app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:100vh}
  .panel{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
  .stage{background:var(--stage);padding:28px;container-type:inline-size}
  .stage-in{max-width:1100px;margin:0 auto}

  /* ---------- Painel de controle ---------- */
  .panel h1{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 4px}
  .panel p.hint{margin:0 0 14px;color:var(--muted);font-size:.85rem;line-height:1.4}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
  .card h2{font:700 1.15rem 'Barlow Condensed',sans-serif;margin:0 0 8px}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:8px}
  input[type=text],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);margin-top:3px}
  input[type=color]{display:block;width:100%;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;margin-top:3px;background:#fff}
  .row{display:grid;grid-template-columns:90px 1fr;gap:10px}
  .scorebox{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
  .scorebox output{flex:1;text-align:center;font:700 2.6rem/1 'Barlow Condensed',sans-serif}
  .scorebox button{width:64px;height:48px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;font-size:1.1rem;cursor:pointer}
  .scorebox button[data-s="-1"]{background:#fff;color:var(--ink);border:1px solid var(--ink)}
  .scorebox button:active{transform:translateY(1px)}
  details summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:4px 0}
  .pl-row{display:grid;grid-template-columns:54px 1fr;gap:6px;margin-top:6px}
  .pl-row input{margin-top:0}
  .tools{display:flex;flex-direction:column;gap:8px}
  .tools label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;margin:0}
  .btn{padding:9px 12px;border-radius:8px;border:1px solid var(--ink);background:#fff;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}

  /* ---------- Placar ---------- */
  .board{display:flex;justify-content:center;align-items:stretch;font:700 clamp(18px,4.6cqw,56px)/1 'Barlow Condensed',sans-serif;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .team{flex:1;display:flex;align-items:stretch;background:#fff;color:var(--ink);min-width:0}
  .team .tname{flex:1;padding:.3em .55em;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team.home .tname{justify-content:flex-end}
  .strip{width:.28em;flex:none}
  .score{background:var(--ink);color:#fff;min-width:1.5em;display:grid;place-items:center;padding:0 .2em;font-size:1.25em}
  .x{background:var(--ink);color:var(--accent);display:grid;place-items:center;padding:0 .1em;font-size:.8em}
  .score.bump{animation:bump .7s ease-out}
  @keyframes bump{0%{transform:scale(1);background:var(--accent);color:var(--ink)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
  .clock{width:max-content;max-width:100%;margin:0 auto;background:var(--ink);color:#fff;font:600 clamp(12px,1.9cqw,22px) 'Barlow',sans-serif;padding:.3em 1.1em;border-radius:0 0 .6em .6em}
  .clock:empty{display:none}

  /* ---------- Campinho ---------- */
  .pitch-wrap{margin-top:24px}
  .pitch{container-type:inline-size;position:relative;aspect-ratio:105/68;border:2px solid var(--chalk);border-radius:4px;overflow:hidden;
    background:repeating-linear-gradient(90deg,var(--grass-a) 0 9.52%,var(--grass-b) 9.52% 19.05%)}
  .pitch i{position:absolute;border:2px solid var(--chalk);pointer-events:none}
  .l-mid{left:50%;top:0;bottom:0;border-width:0 0 0 2px!important;transform:translateX(-1px)}
  .l-circle{left:50%;top:50%;width:17.4%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
  .l-box{top:20.35%;height:59.3%;width:15.7%}
  .l-box.l{left:-2px}.l-box.r{right:-2px}
  .l-six{top:36.5%;height:26.9%;width:5.24%}
  .l-six.l{left:-2px}.l-six.r{right:-2px}
  .pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;width:12cqw}
  .dot{width:3.9cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 2cqw 'Barlow Condensed',sans-serif;border:.25cqw solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4)}
  .pn{margin-top:.3cqw;color:#fff;font:600 1.6cqw/1.1 'Barlow',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .legend{display:flex;justify-content:space-between;color:#fff;font:600 1.1rem 'Barlow Condensed',sans-serif;margin-bottom:8px}
  .legend span::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);margin-right:.45em;border:2px solid #fff;vertical-align:-1px}

  /* ---------- Modo transmissão ---------- */
  body.overlay{background:transparent}
  body.overlay .panel{display:none}
  body.overlay .app{display:block}
  body.overlay .stage{background:transparent;padding:16px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .panel{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  }
  @media (prefers-reduced-motion:reduce){.score.bump{animation:none}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Painel de controle ===== -->
  <aside class="panel">
    <h1>Painel da transmissão</h1>
    <p class="hint">Edite os dados aqui e veja o resultado ao lado. Clique em um jogador no campinho para editar o nome dele.</p>
    <div id="teams"></div>
    <div class="card">
      <h2>Partida</h2>
      <label>Texto do tempo
        <input type="text" id="tempo" placeholder="Ex.: 1º tempo • 23'">
      </label>
      <div class="tools">
        <label class="chk"><input type="checkbox" id="showPitch"> Mostrar campinho</label>
        <button class="btn" id="reset">Zerar placar</button>
        <button class="btn primary" id="overlayBtn">Modo transmissão (Esc para sair)</button>
      </div>
    </div>
  </aside>

  <!-- ===== Palco: o que vai para a live ===== -->
  <main class="stage">
    <div class="stage-in">
      <div class="board" aria-live="polite">
        <div class="team home"><span class="tname" id="nameH"></span><span class="strip" id="stripH"></span></div>
        <div class="score" id="sH">0</div>
        <div class="x">x</div>
        <div class="score" id="sA">0</div>
        <div class="team away"><span class="strip" id="stripA"></span><span class="tname" id="nameA"></span></div>
      </div>
      <div class="clock" id="clk"></div>

      <div class="pitch-wrap" id="pitchWrap">
        <div class="legend"><span id="legH"></span><span id="legA"></span></div>
        <div class="pitch" id="pitch">
          <i class="l-mid"></i><i class="l-circle"></i>
          <i class="l-box l"></i><i class="l-box r"></i>
          <i class="l-six l"></i><i class="l-six r"></i>
          <div id="players"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
/* =========================================================
   1) DADOS (tudo manual por enquanto)
   Depois, é aqui que os dados da API vão entrar.
   ========================================================= */
const FORMATIONS = {            // defensores – meias – atacantes (goleiro é sempre o 1º)
  '4-4-2':[4,4,2], '4-3-3':[4,3,3], '3-5-2':[3,5,2], '4-2-3-1':[4,2,3,1], '5-3-2':[5,3,2]
};
const KEY = 'painel-futebol-v1';

const novoTime = (nome, cor, formacao) => ({
  name: nome, color: cor, formation: formacao, score: 0,
  players: Array.from({length:11}, (_, i) => ({ num: i+1, name: 'Jogador ' + (i+1) }))
});

let state = {
  tempo: 'Pré-jogo',
  showPitch: true,
  teams: [ novoTime('Time 1', '#d62839', '4-3-3'), novoTime('Time 2', '#1d4ed8', '4-4-2') ]
};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.teams && s.teams.length === 2) state = s;
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* =========================================================
   2) FUNÇÕES AUXILIARES
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// cor do texto (preto/branco) conforme a cor do time
function textOn(hex){
  const n = parseInt(hex.slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (r*299 + g*587 + b*114)/1000 > 150 ? '#14201a' : '#fff';
}

// posições (em %) dos 11 jogadores no campo; mandante à esquerda, visitante espelhado à direita
function positions(formation, away){
  const lines = FORMATIONS[formation] || FORMATIONS['4-4-2'];
  const pts = [{x:7, y:50}];                       // goleiro
  lines.forEach((qtd, i) => {
    const x = lines.length > 1 ? 19 + i * (26/(lines.length-1)) : 32;
    for (let j = 0; j < qtd; j++) pts.push({ x, y: 100*(j+1)/(qtd+1) });
  });
  return pts.map(p => away ? {x:100-p.x, y:100-p.y} : p);
}

/* =========================================================
   3) DESENHO DO PALCO (o que aparece na live)
   ========================================================= */
function renderStage(){
  const [h, a] = state.teams;
  $('#nameH').textContent = h.name;   $('#nameA').textContent = a.name;
  $('#stripH').style.background = h.color; $('#stripA').style.background = a.color;
  $('#sH').textContent = h.score;     $('#sA').textContent = a.score;
  $('#clk').textContent = state.tempo;
  $('#pitchWrap').hidden = !state.showPitch;

  $('#legH').style.setProperty('--c', h.color); $('#legH').textContent = h.name + ' (' + h.formation + ')';
  $('#legA').style.setProperty('--c', a.color); $('#legA').textContent = a.name + ' (' + a.formation + ')';

  $('#players').innerHTML = state.teams.map((t, ti) =>
    positions(t.formation, ti === 1).map((p, i) => `
      <div class="pl" data-t="${ti}" data-i="${i}" style="left:${p.x}%;top:${p.y}%" title="Editar jogador">
        <span class="dot" style="background:${t.color};color:${textOn(t.color)}">${esc(t.players[i].num)}</span>
        <span class="pn">${esc(t.players[i].name)}</span>
      </div>`).join('')
  ).join('');

  // atualiza também os números do painel
  state.teams.forEach((t, i) => { const o = $('#sc'+i); if (o) o.textContent = t.score; });
}

function bump(id){
  const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

/* =========================================================
   4) PAINEL DE CONTROLE
   ========================================================= */
function buildPanel(){
  $('#teams').innerHTML = state.teams.map((t, ti) => `
    <section class="card">
      <h2>${ti ? 'Time visitante' : 'Time mandante'}</h2>
      <label>Nome do time
        <input type="text" data-t="${ti}" data-f="name" value="${esc(t.name)}">
      </label>
      <div class="row">
        <label>Cor <input type="color" data-t="${ti}" data-f="color" value="${t.color}"></label>
        <label>Formação
          <select data-t="${ti}" data-f="formation">
            ${Object.keys(FORMATIONS).map(f => `<option${f===t.formation?' selected':''}>${f}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="scorebox">
        <button data-t="${ti}" data-s="-1" aria-label="Remover 1 gol">−1</button>
        <output id="sc${ti}">${t.score}</output>
        <button data-t="${ti}" data-s="1" aria-label="Adicionar 1 gol">+1</button>
      </div>
      <details id="det${ti}">
        <summary>Escalação (11 jogadores)</summary>
        ${t.players.map((p, i) => `
          <div class="pl-row">
            <input type="text" inputmode="numeric" data-t="${ti}" data-i="${i}" data-f="pnum" value="${esc(p.num)}" aria-label="Número do jogador ${i+1}">
            <input type="text" data-t="${ti}" data-i="${i}" data-f="pname" value="${esc(p.name)}" aria-label="Nome do jogador ${i+1}">
          </div>`).join('')}
      </details>
    </section>`).join('');

  $('#tempo').value = state.tempo;
  $('#showPitch').checked = state.showPitch;
}

// edição de campos
$('#teams').addEventListener('input', e => {
  const el = e.target, t = state.teams[+el.dataset.t], f = el.dataset.f;
  if (!t || !f) return;
  if (f === 'pnum')  t.players[+el.dataset.i].num  = el.value;
  else if (f === 'pname') t.players[+el.dataset.i].name = el.value;
  else t[f] = el.value;
  renderStage(); save();
});

// botões +1 / -1
$('#teams').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  const ti = +b.dataset.t, d = +b.dataset.s, t = state.teams[ti];
  t.score = Math.max(0, t.score + d);
  renderStage(); save();
  if (d > 0) bump(ti ? '#sA' : '#sH');
});

// clicar no jogador do campinho abre e foca o campo dele no painel
$('#players').addEventListener('click', e => {
  const p = e.target.closest('.pl'); if (!p || document.body.classList.contains('overlay')) return;
  $('#det' + p.dataset.t).open = true;
  const inp = document.querySelector(`input[data-f="pname"][data-t="${p.dataset.t}"][data-i="${p.dataset.i}"]`);
  if (inp){ inp.scrollIntoView({block:'center'}); inp.focus(); inp.select(); }
});

$('#tempo').addEventListener('input', e => { state.tempo = e.target.value; renderStage(); save(); });
$('#showPitch').addEventListener('change', e => { state.showPitch = e.target.checked; renderStage(); save(); });
$('#reset').addEventListener('click', () => { state.teams.forEach(t => t.score = 0); renderStage(); save(); });

/* =========================================================
   5) MODO TRANSMISSÃO (fundo transparente, sem painel)
   Dica: abra o painel em uma aba e o modo transmissão
   (?overlay) em outra; as mudanças são sincronizadas.
   ========================================================= */
const setOverlay = on => document.body.classList.toggle('overlay', on);
$('#overlayBtn').addEventListener('click', () => setOverlay(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setOverlay(false); });
if (new URLSearchParams(location.search).has('overlay')) setOverlay(true);

// quando outra aba altera os dados, esta atualiza sozinha
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  load(); buildPanel(); renderStage();
});

/* ---------- início ---------- */
load();
buildPanel();
renderStage();
</script>
</body>
</html>
